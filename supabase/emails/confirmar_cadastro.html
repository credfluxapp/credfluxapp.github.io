<!-- Supabase › Authentication › Emails › Templates › "Confirm signup"
     Assunto (Subject): Seu código de confirmação do CredFlux
     Cole tudo abaixo desta linha no campo "Message body". -->
<div style="margin:0;padding:24px 12px;background:#F4F6F5;font-family:Arial,Helvetica,sans-serif;color:#1B212D">
  <div style="max-width:480px;margin:0 auto;background:#FFFFFF;border:1px solid #E4E7EC;border-radius:14px;overflow:hidden">
    <div style="background:#20201F;padding:18px 24px">
      <span style="display:inline-block;background:#C8EE44;color:#1B212D;font-weight:700;font-size:15px;border-radius:8px;padding:5px 11px">CredFlux</span>
    </div>
    <div style="padding:26px 24px">
      <h1 style="margin:0 0 12px;font-size:20px">Confirme seu e-mail</h1>
      <p style="margin:0 0 18px;font-size:15px;line-height:1.5">Digite este código na tela do CredFlux para concluir o seu cadastro:</p>
      <p style="margin:0 0 18px;padding:16px;border-radius:10px;background:#F8F8F8;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#646F82">O código vale por 1 hora. Se você não pediu este cadastro, ignore este e-mail.</p>
      <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#646F82">Todos os dados são protegidos por criptografia, com segurança, discrição e total sigilo.</p>
    </div>
  </div>
</div>
